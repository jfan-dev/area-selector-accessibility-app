[package]
name = "area_selector"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "area_selector"
path = "src/main.rs"

[dependencies]
eframe = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
image = "0.24"

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
] }


[build-dependencies]
embed-resource = "2.5"
image = { version = "0.24", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
