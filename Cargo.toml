[package]
name = "area_selector"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "area_selector"
path = "src/main.rs"

[dependencies]
# glow renderer (as before the upgrade); wgpu, the new default, is not used.
# accesskit keeps screen-reader support.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
# Bundled emoji/symbol fonts (🔍 📐 🏠 …): optional since egui 0.37 and not forwarded by eframe.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Globalization",
] }


[build-dependencies]
embed-resource = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
